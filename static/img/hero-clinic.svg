<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-label="A doctor outside a clinic, with an appointment card and a heartbeat monitor">
  <style>
    .beat{fill:none;stroke:#F2545B;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s ease-out .4s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.beat{animation:none;stroke-dashoffset:0}}
  </style>
  <circle cx="300" cy="240" r="215" fill="#12394A"/>
  <circle cx="300" cy="240" r="155" fill="#164A5C"/>
  <rect x="30" y="418" width="540" height="14" rx="7" fill="#0B6E75" opacity=".55"/>

  <!-- clinic -->
  <rect x="80" y="170" width="260" height="250" rx="14" fill="#EAF3F4"/>
  <path d="M80 184a14 14 0 0 1 14-14h232a14 14 0 0 1 14 14v22H80z" fill="#0B6E75"/>
  <circle cx="210" cy="124" r="46" fill="#fff"/>
  <rect x="199" y="97" width="22" height="54" rx="4" fill="#F2545B"/>
  <rect x="183" y="113" width="54" height="22" rx="4" fill="#F2545B"/>
  <g fill="#BFD9DD"><rect x="108" y="232" width="56" height="50" rx="6"/><rect x="256" y="232" width="56" height="50" rx="6"/>
    <rect x="108" y="306" width="56" height="50" rx="6"/><rect x="256" y="306" width="56" height="50" rx="6"/></g>
  <g stroke="#EAF3F4" stroke-width="3"><path d="M136 232v50M108 257h56M284 232v50M256 257h56M136 306v50M108 331h56M284 306v50M256 331h56"/></g>
  <rect x="184" y="336" width="52" height="84" rx="8" fill="#0B6E75"/>
  <rect x="192" y="346" width="16" height="40" rx="3" fill="#7FD0C9" opacity=".7"/><rect x="212" y="346" width="16" height="40" rx="3" fill="#7FD0C9" opacity=".7"/>
  <circle cx="226" cy="382" r="3" fill="#EAF3F4"/>

  <!-- plants -->
  <g><rect x="52" y="392" width="26" height="26" rx="5" fill="#C9763B"/>
    <path d="M65 392c-18-14-22-38-8-54 4 22 12 34 8 54zM65 392c14-12 20-34 10-52-6 20-12 32-10 52z" fill="#2E9E6B"/></g>

  <!-- doctor -->
  <ellipse cx="438" cy="420" rx="52" ry="8" fill="#0E2A33" opacity=".35"/>
  <rect x="398" y="352" width="22" height="66" rx="8" fill="#0E2A33"/><rect x="432" y="352" width="22" height="66" rx="8" fill="#0E2A33"/>
  <ellipse cx="408" cy="419" rx="16" ry="6" fill="#0B6E75"/><ellipse cx="444" cy="419" rx="16" ry="6" fill="#0B6E75"/>
  <rect x="380" y="262" width="92" height="132" rx="30" fill="#fff"/>
  <path d="M408 262l18 34 18-34z" fill="#0B6E75"/>
  <rect x="364" y="276" width="26" height="92" rx="13" fill="#fff"/>
  <rect x="462" y="276" width="26" height="92" rx="13" fill="#fff"/>
  <circle cx="377" cy="372" r="12" fill="#F2C6A0"/><circle cx="475" cy="372" r="12" fill="#F2C6A0"/>
  <path d="M408 270c-12 30-4 58 18 58s30-28 18-58" fill="none" stroke="#C9D5D8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="426" cy="330" r="7" fill="#C9D5D8"/><circle cx="426" cy="330" r="3" fill="#0E2A33"/>
  <rect x="400" y="206" width="52" height="60" rx="22" fill="#F2C6A0"/>
  <path d="M396 232c-6-34 14-48 32-48s38 14 26 46c-4-14-14-22-28-22s-22 8-30 24z" fill="#2B2118"/>
  <circle cx="416" cy="236" r="3" fill="#2B2118"/><circle cx="438" cy="236" r="3" fill="#2B2118"/>
  <path d="M419 250q8 7 16 0" fill="none" stroke="#2B2118" stroke-width="3" stroke-linecap="round"/>
  <rect x="448" y="324" width="44" height="58" rx="6" fill="#EAF3F4" stroke="#0B6E75" stroke-width="3" transform="rotate(8 470 353)"/>
  <g stroke="#0B6E75" stroke-width="3" stroke-linecap="round" transform="rotate(8 470 353)"><path d="M456 342h28M456 354h28M456 366h16"/></g>

  <!-- appointment card -->
  <g transform="translate(352 70)">
    <rect width="190" height="96" rx="16" fill="#fff"/>
    <circle cx="36" cy="38" r="20" fill="#7FD0C9"/><path d="M28 38l6 6 12-12" fill="none" stroke="#0E2A33" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="68" y="24" width="96" height="10" rx="5" fill="#0E2A33"/><rect x="68" y="44" width="64" height="8" rx="4" fill="#9FB6BB"/>
    <rect x="20" y="68" width="62" height="16" rx="8" fill="#2E9E6B"/><rect x="90" y="68" width="40" height="16" rx="8" fill="#E1E8EA"/>
  </g>
  <!-- heartbeat card -->
  <g transform="translate(40 40)">
    <rect width="132" height="66" rx="14" fill="#fff"/>
    <path class="beat" pathLength="1" d="M12 38h20l7-20 10 38 8-18h12l6-8 8 8h37"/>
  </g>
  <!-- calendar chip -->
  <g transform="translate(494 262)">
    <rect width="74" height="78" rx="12" fill="#fff"/><path d="M0 24v-12a12 12 0 0 1 12-12h50a12 12 0 0 1 12 12v12z" fill="#F2545B"/>
    <g fill="#9FB6BB"><circle cx="20" cy="42" r="4"/><circle cx="37" cy="42" r="4"/><circle cx="54" cy="42" r="4"/><circle cx="20" cy="60" r="4"/><circle cx="54" cy="60" r="4"/></g>
    <circle cx="37" cy="60" r="6" fill="#2E9E6B"/>
  </g>
</svg>
